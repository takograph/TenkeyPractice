.is-running .question{display:block;padding:48px 0;min-height:180px;font-size:clamp(26px,2.88vw,40px);line-height:1.6;letter-spacing:1px;white-space:pre-wrap;overflow-wrap:anywhere}

<body><div class="app">
<header class="top">
 <div class="brand"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div><h1>TenkeyPractice</h1><div class="sub">テンキー・記号入力トレーニング</div></div></div>
 <div class="header-tools"><span class="version">v1.5.0</span><details class="settings" id="settings"><summary>設定</summary><div class="settings-panel">
 <h2 class="settings-title">サウンド設定</h2><label class="soundControl">正解音<select id="soundMode"><option value="pop">Pop</option><option value="rise">Rise</option><option value="short_pop">Short Pop</option><option value="glass_pop">Glass Pop</option><option value="cork_tap">Cork Tap</option><option value="mini_chime">Mini Chime</option><option value="drop_pop">Drop Pop</option><option value="marimba_tap">Marimba Tap</option></select></label>
 <label class="volumeControl">音量<span class="volume-row"><input id="volume" type="range" min="0" max="100" value="50" step="1"><span id="volumeValue">50%</span></span></label>
 <div class="dataControl"><h2 class="settings-title">記録のバックアップ</h2><div class="data-buttons"><button id="backupBtn" type="button">バックアップ</button><button id="restoreBtn" type="button">復元</button></div><input id="restoreFile" type="file" accept=".json,application/json" hidden><p class="settings-copy">記録をファイルに保存・移行できます。復元すると現在の記録が置き換わります。</p></div>
 </div></details></div>
</header>
<div id="dataStatus" class="data-status" aria-live="polite"></div><div id="saveStatus" class="save-status" role="alert"></div>
<main class="workspace"><div class="primary-column">
 <section class="practice panel is-idle" id="practicePanel" aria-label="入力練習">
  <div class="session-controls"><label class="field">練習モード<select id="mode" aria-label="練習モード"><option value="six">6桁数字</option><option value="money">金額</option><option value="zeros">00キー重視</option><option value="calc">四則演算（+-*/）</option><optgroup label="記号モード"><option value="symbol_single">記号：単体</option><option value="symbol_pair">記号：ペア</option><option value="symbol_text">記号：実用短文</option></optgroup></select></label><label class="field">制限時間<select id="limit" aria-label="制限時間"><option value="60" selected>1:00</option><option value="90">1:30</option><option value="120">2:00</option><option value="180">3:00</option></select></label><button class="primary" id="start">開始</button></div>
  <div class="practice-body"><div class="practice-meta"><span class="practice-status" id="practiceStatus">開始待ち</span><div class="timer"><span class="timer-label">残り時間</span><span class="timer-value" id="time">01:00</span></div></div>
  <div class="question" id="question">Enterで開始</div><label class="answer-label" for="answer">入力欄</label><input class="answer" id="answer" inputmode="numeric" autocomplete="off" spellcheck="false" disabled></div>
  <div class="time-track" aria-hidden="true"><i id="timeProgress"></i></div>
 </section>
 <section class="results panel" id="results" aria-label="今回の結果"><div class="results-head"><h2 class="section-title">今回の結果</h2><span id="recordMark" class="record-mark"></span></div><div class="result-grid">
  <div class="result-box"><span class="label">正入力</span><div class="result-value-line"><b id="rChars">0</b><span class="result-unit">文字</span></div><span id="rQuestions" class="result-sub">0 問</span></div>
  <div class="result-box"><span class="label">正入力の速度</span><div class="result-value-line"><b id="rSpeed">—</b><span class="result-unit">文字/秒</span></div></div>
  <div class="result-box"><span class="label">正確率</span><div class="result-value-line"><b id="rAccuracy">—</b><span class="result-unit">%</span></div></div>
  <div class="result-box"><span class="label">ミス</span><div class="result-value-line"><b id="rMiss">—</b><span class="result-unit">回</span></div></div>
 </div><div class="comparison" id="comparison" aria-live="polite"></div></section><p class="history-note" id="historyNote"></p>
</div>
<aside class="insights" aria-label="成績と分析"><section class="summary-card panel"><h2 class="section-title">練習の記録</h2><span id="todayMode" class="summary-mode">6桁数字 / 01:00</span><div class="best-grid">

</aside></main>

</div><script>

const stateKey='tenkey_state_v6';
let storedData={},storageReady=true;
try{
  const saved=localStorage.getItem(stateKey);
  if(saved!==null){const state=JSON.parse(saved);if(state.version!==1||!state.data||Array.isArray(state.data)||typeof state.data!=='object')throw Error('invalid state');storedData=state.data}
  else for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('tenkey_')&&k!==stateKey)storedData[k]=localStorage.getItem(k)}
}catch(err){storageReady=false;$('saveStatus').textContent='記録を読み込めませんでした。保存を停止しています。元の記録を確認し、バックアップから復元してください。'}

function commitData(candidate){if(!storageReady)throw Error('storage unavailable');localStorage.setItem(stateKey,JSON.stringify({version:1,data:candidate}))}
function persistData(){try{commitData(storedData);$('saveStatus').textContent='';return true}catch(err){$('saveStatus').textContent='記録を保存できませんでした。この画面を閉じる前にバックアップしてください。バックアップには今回の結果も含まれます。';return false}}

const bestKey=(m,seconds=Number($('limit').value))=>`tenkey_best_${m}_${seconds}`;const historyKey="tenkey_sessions_v5";const legacyHistoryKeys=["tenkey_sessions_v2","tenkey_sessions_v4"];
function localDateKey(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");return `${y}-${m}-${d}`}
function parseDateKey(s){const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)}
function dayDiff(a,b){return Math.round((parseDateKey(a)-parseDateKey(b))/86400000)}

function ownSessions(){return safeReadArray(historyKey).filter(x=>x&&typeof x.date==="string"&&typeof x.mode==="string")}
function legacySessions(){const out=[];for(const key of legacyHistoryKeys){for(const x of safeReadArray(key)){if(x&&typeof x.date==="string"&&typeof x.mode==="string")out.push(x)}}return out}
function allSessionsForHabit(){return [...legacySessions(),...ownSessions()]}

function getTodayBest(mode=$("mode").value){const today=localDateKey();let b=0;for(const s of allSessionsForHabit()){if(s.mode===mode&&s.duration===Number($("limit").value)&&s.date===today){const v=Number(s.chars);if(Number.isFinite(v)&&v>b)b=v}}return b}
function getStreak(){const dates=[...new Set(allSessionsForHabit().map(s=>s.date))].sort();if(!dates.length)return 0;const today=localDateKey(),last=dates[dates.length-1];if(last!==today&&dayDiff(today,last)>1)return 0;let streak=1;for(let i=dates.length-1;i>0;i--){if(dayDiff(dates[i],dates[i-1])===1)streak++;else break}return streak}

function audio(){

    audioCtx=new(window.AudioContext||window.webkitAudioContext)();

  if(audioCtx.state==="suspended")audioCtx.resume();

function ensureSampleBuffer(c,name){
  if(sampleBuffers[name])return sampleBuffers[name];
  const def=embeddedSamples[name];if(!def)return null;
  const bin=atob(def.pcm16),count=Math.floor(bin.length/2),buffer=c.createBuffer(1,count,def.sampleRate),ch=buffer.getChannelData(0);
  for(let i=0;i<count;i++){let v=bin.charCodeAt(i*2)|(bin.charCodeAt(i*2+1)<<8);if(v&0x8000)v-=0x10000;ch[i]=v/32768}

  const c=audio(),buffer=ensureSampleBuffer(c,name);if(!buffer)return;
  const src=c.createBufferSource();src.buffer=buffer;src.connect(masterGain);src.start();

function correctSound(){
  const mode=$("soundMode").value;
  if(embeddedSamples[mode])playEmbeddedSample(mode);

function missSound(){
  const c=audio(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type="square";
  o.frequency.setValueAtTime(145,t);
  o.frequency.exponentialRampToValueAtTime(90,t+.075);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.21,t+.004);
  g.gain.exponentialRampToValueAtTime(.0001,t+.105);
  o.connect(g).connect(masterGain);
  o.start(t);o.stop(t+.11);
}


function randDigits(n){let s="";for(let i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s}
function makeQuestion(){
  const m=$("mode").value;
  if(m==="symbol_single")return pick(symbolChars);
  if(m==="symbol_pair")return pick(symbolPairs);
  if(m==="symbol_text")return pick(symbolTexts);
  if(m==="six")return randDigits(6);
  if(m==="zeros"){
    const n=3+Math.floor(Math.random()*4);
    return randDigits(n).slice(0,-2)+"00";
  }
  if(m==="money"){
    const n=3+Math.floor(Math.random()*5);
    let s=randDigits(n);
    if(Math.random()<.7)s=s.slice(0,-2)+"00";
    return Number(s).toLocaleString("ja-JP");
  }
  const ops=["+","-","*","/"],op=ops[Math.floor(Math.random()*4)];
  let a,b;
  if(op==="/"){b=1+Math.floor(Math.random()*99);a=b*(1+Math.floor(Math.random()*999))}
  else if(op==="*"){a=1+Math.floor(Math.random()*9999);b=1+Math.floor(Math.random()*99)}
  else{
    a=100+Math.floor(Math.random()*999900);
    b=1+Math.floor(Math.random()*99999);
    if(op==="-"&&b>a)[a,b]=[b,a];
  }
  return {raw:String(a)+op+String(b),display:String(a)+" "+op+" "+String(b)};
}

function resetPracticeState(){clearTimeout(nextTimer);clearTimeout(flashTimer);nextTimer=null;questionNo=0;target="";idx=0;startTime=0;qStart=0;totalInput=0;mistakes=0;completedChars=0;qTimes=[];keyMistakes={};keyTotals={}}
function goIdle(){if(timer){clearInterval(timer);timer=null}started=false;finished=false;lockSettings(false);resetPracticeState();$("answer").disabled=true;$("answer").value="";$("answer").className="answer";$("question").classList.remove("calc-question","finish-question","symbol-question");$("question").textContent="Enterで開始";$("time").textContent=fmt(Number($("limit").value));$("time").classList.remove("warn");$("start").textContent="開始";$("results").style.display="none";$("comparison").textContent="";$("recordMark").textContent="";syncModeUI();updateSummary()}
function recordSession(){
 const mode=$('mode').value,data=ownSessions();
 const previous=data.filter(s=>s.mode===mode&&s.duration===timeLimit).at(-1);
 const session={date:localDateKey(),mode,duration:timeLimit,chars:completedChars,misses:mistakes,speed:completedChars/timeLimit,accuracy:totalInput?completedChars/totalInput*100:null,keyTotals:{...keyTotals},keyMistakes:{...keyMistakes}};
 const newRecord=completedChars>getBest(mode);
 if(newRecord)storedData[bestKey(mode,timeLimit)]=String(completedChars);
 data.push(session);saveOwnSessions(data);
 return {session,previous,newRecord};
}
function startPractice(){$("settings").open=false;audio();timeLimit=Number($("limit").value);resetPracticeState();started=true;finished=false;lockSettings(true);startTime=performance.now();$("answer").disabled=false;$("answer").value="";$("answer").className="answer";$("question").classList.remove("finish-question");$("results").style.display="none";$("comparison").textContent="";$("recordMark").textContent="";$("start").textContent="中止";$("time").textContent=fmt(timeLimit);$("time").classList.remove("warn");syncModeUI();next();if(timer)clearInterval(timer);timer=setInterval(updateTimer,100)}
function next(){
 if(!started)return;
 const q=makeQuestion();target=typeof q==='string'?q:q.raw;idx=0;questionNo++;qStart=performance.now();
 $('question').classList.toggle('symbol-question',isSymbolMode());$('question').classList.toggle('calc-question',$('mode').value==='calc');
 $('answer').value='';$('answer').className='answer';syncModeUI();renderQuestion();$('answer').focus();
}

function updateTimer(){if(!started)return;const elapsed=(performance.now()-startTime)/1000,remain=Math.max(0,timeLimit-elapsed);$("time").textContent=fmt(remain);$("timeProgress").style.width=(remain/timeLimit*100)+"%";$("time").classList.toggle("warn",remain<=10);$("timeProgress").classList.toggle("warn",remain<=10);if(remain<=0)finish()}
function finish(){if(!started)return;started=false;finished=true;$("answer").value="";syncModeUI();clearTimeout(nextTimer);clearTimeout(flashTimer);lockSettings(false);if(timer){clearInterval(timer);timer=null}$("answer").disabled=true;$("question").classList.remove("calc-question","symbol-question");$("question").classList.add("finish-question");$("question").innerHTML='<span class="finish-main">終了</span><span class="finish-hint">Enterで開始</span>';$("time").textContent="00:00";$("time").classList.remove("warn");const {session,previous,newRecord}=recordSession(),speed=session.speed;
$('rAccuracy').textContent=session.accuracy===null?'—':session.accuracy.toFixed(1);
$('comparison').textContent=previous?'前回比（'+modeNames[session.mode]+' / '+fmt(timeLimit)+'）：正入力 '+(completedChars-previous.chars>=0?'+':'')+(completedChars-previous.chars)+'文字':'同じモード・制限時間の前回記録はありません';
$("rChars").textContent=String(completedChars);$("rQuestions").textContent=qTimes.length+" 問";$("rSpeed").textContent=speed.toFixed(1);$("rMiss").textContent=String(mistakes);$("recordMark").textContent=newRecord?"自己ベスト更新":"";$("results").style.display="block";$("start").textContent="開始";updateSummary()}
window.addEventListener("keydown",e=>{
  if(e.isComposing||e.keyCode===229||e.ctrlKey||e.altKey||e.metaKey)return;
  const control=e.target&&e.target.closest('button,select,summary,input:not(#answer)');
  if(!started){if(!control&&!e.repeat&&(e.key==='Enter'||e.key===' ')){e.preventDefault();startPractice()}return}
  if(control)return;
  if((performance.now()-startTime)/1000>=timeLimit){e.preventDefault();finish();return}
  if(['Backspace','Enter','Tab','Escape','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();return}
  if(e.key.length!==1)return;
  e.preventDefault();
  if(idx>=target.length)return;
  const symbols=isSymbolMode(),calc=$('mode').value==='calc',allowed=symbols?/^[\x20-\x7e]$/:calc?/^[0-9+\-*/]$/:/^[0-9,]$/;
  if(!allowed.test(e.key))return;
  const expected=target[idx];keyTotals[expected]=(keyTotals[expected]||0)+1;
  if(e.key===expected){
    correctSound();idx++;completedChars++;totalInput++;$('answer').value=target.slice(0,idx);
    renderQuestion();
    if(idx>=target.length){qTimes.push((performance.now()-qStart)/1000);nextTimer=setTimeout(()=>{nextTimer=null;if(started)next()},35)}
  }else{
    missSound();mistakes++;totalInput++;keyMistakes[expected]=(keyMistakes[expected]||0)+1;
    $('answer').classList.add('bad');clearTimeout(flashTimer);flashTimer=setTimeout(()=>$('answer').classList.remove('bad'),80);
  }
});

function showDataStatus(message,isError=false){
  const el=$("dataStatus");el.textContent=message;el.style.color=isError?"var(--bad)":"var(--muted)";
  clearTimeout(showDataStatus._timer);if(isError)return;showDataStatus._timer=setTimeout(()=>{el.textContent="";el.style.color=""},4200);
}
function makeBackupObject(){return{app:'TenkeyPractice',appVersion:APP_VERSION,backupFormat:1,exportedAt:new Date().toISOString(),localStorage:{...storedData}}}
function backupRecords(){
  try{
    const payload=JSON.stringify(makeBackupObject(),null,2),blob=new Blob([payload],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    const d=new Date(),pad=n=>String(n).padStart(2,"0"),stamp=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    a.href=url;a.download=`TenkeyPractice_backup_${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    showDataStatus("バックアップを保存しました");
  }catch(err){console.error(err);showDataStatus("バックアップに失敗しました",true)}
}
function validateBackup(obj){
 if(!obj||obj.app!=='TenkeyPractice'||obj.backupFormat!==1||!obj.localStorage||Array.isArray(obj.localStorage)||typeof obj.localStorage!=='object')throw Error('形式が異なります');
 const entries=Object.entries(obj.localStorage);if(!entries.length)throw Error('記録が空です');
 const nonnegative=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0;
 for(const [k,v]of entries){
  if(typeof v!=='string')throw Error('記録の形式が異なります');
  if(/^tenkey_sessions_v[245]$/.test(k)){
   const sessions=JSON.parse(v);if(!Array.isArray(sessions))throw Error('履歴が不正です');
   for(const s of sessions){
    if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!Object.hasOwn(modeNames,s.mode)||!nonnegative(s.chars))throw Error('履歴が不正です');
    if(s.duration!==undefined&&![60,90,120,180].includes(s.duration))throw Error('練習時間が不正です');
    for(const field of ['misses','speed'])if(s[field]!==undefined&&!nonnegative(s[field]))throw Error('成績が不正です');
    for(const field of ['keyTotals','keyMistakes'])if(s[field]!==undefined){if(!s[field]||Array.isArray(s[field])||typeof s[field]!=='object'||Object.entries(s[field]).some(([key,n])=>key.length!==1||!nonnegative(n)))throw Error('キー分析が不正です')}
   }
  }else if(k.startsWith('tenkey_best_')){
   const suffix=k.slice(12);if(!Object.keys(modeNames).some(m=>suffix===m||[60,90,120,180].some(d=>suffix===m+'_'+d))||!v.trim()||!Number.isFinite(Number(v))||Number(v)<0)throw Error('ベスト記録が不正です');
  }else if(k==='tenkey_volume'){if(!v.trim()||!Number.isFinite(Number(v))||Number(v)<0||Number(v)>100)throw Error('音量が不正です')}
  else if(k==='tenkey_sound'){if(!Object.hasOwn(embeddedSamples,v)&&!removedSoundNames.includes(v))throw Error('音の設定が不正です')}
  else throw Error('未対応の記録が含まれています');
 }
 const data=Object.fromEntries(entries);if(removedSoundNames.includes(data.tenkey_sound))data.tenkey_sound='pop';return data;
}
function applySoundSettings(){
 const sm=readStored('tenkey_sound');if(removedSoundNames.includes(sm))saveSetting('tenkey_sound','pop');$('soundMode').value=[...$('soundMode').options].some(o=>o.value===sm)?sm:'pop';
 const sv=readStored('tenkey_volume'),v=sv===null?50:Math.max(0,Math.min(100,Number(sv)||0));$('volume').value=v;$('volumeValue').textContent=v+'%';if(masterGain&&audioCtx)masterGain.gain.setValueAtTime(v/100,audioCtx.currentTime);
}
async function restoreRecords(file){
 if(started)return;
 let candidate;
 try{candidate=validateBackup(JSON.parse(await file.text()))}catch(err){showDataStatus('復元できません。ファイルの内容を確認してください。現在の記録は変更していません。',true);return}
 if(started){showDataStatus('練習を終了してから復元してください。',true);return}
 try{localStorage.setItem(stateKey,JSON.stringify({version:1,data:candidate}))}catch(err){showDataStatus('復元データを保存できませんでした。現在の記録は変更していません。',true);return}
 storedData=candidate;storageReady=true;$('saveStatus').textContent='';applySoundSettings();goIdle();showDataStatus('バックアップから復元しました');
}
$("backupBtn").addEventListener("click",backupRecords);
$("restoreBtn").addEventListener("click",()=>$("restoreFile").click());
$("restoreFile").addEventListener("change",async e=>{const file=e.target.files&&e.target.files[0];if(file)await restoreRecords(file);e.target.value=""});

$("answer").addEventListener("input",()=>{if(started)$("answer").value=target.slice(0,idx)});$("start").addEventListener("click",()=>{if(started)goIdle();else startPractice()});$("mode").addEventListener("change",()=>{if(!started)goIdle()});$("limit").addEventListener("change",()=>{if(!started)goIdle()});$("volume").addEventListener("input",()=>{const v=Number($("volume").value);$("volumeValue").textContent=v+"%";if(masterGain)masterGain.gain.setValueAtTime(v/100,audioCtx.currentTime);saveSetting("tenkey_volume",v)});$("soundMode").addEventListener("change",()=>{saveSetting("tenkey_sound",$("soundMode").value)})
$('weakRange').addEventListener('change',updateWeakKeys);
window.addEventListener('click',e=>{
 const settings=$('settings');
 if(settings.open&&!settings.contains(e.target)){
  if(settings.contains(document.activeElement))document.activeElement.blur();
  settings.open=false;
 }
});
$('settings').addEventListener('keydown',e=>{if(e.key==='Escape'){$('settings').open=false;$('settings').querySelector('summary').focus()}});
window.addEventListener('load',()=>{applySoundSettings();goIdle()});
</script>
